services:
  - type: web
    name: tapas-demo
    runtime: node
    region: frankfurt
    # LET OP: 'disk' vereist een BETAALD plan. Zet dit op 'starter' (of hoger)
    # in het Render-dashboard; een gratis service kan geen persistente schijf
    # gebruiken. Met een disk draait de service op max 1 instance (geen horizontale
    # schaling) — voor deze pilot geen bezwaar.
    plan: starter
    nodeVersion: 20.19.0

    buildCommand: pip3 install -r requirements.txt && npm install --legacy-peer-deps && npm run build
    # data.db staat in .gitignore en wordt NIET meegedeployed: de code seedt/migreert
    # de database zelf bij startup (server/storage.ts). Met TAPAS_DB_PATH -> /data/data.db
    # gebeurt dat éénmalig op de persistente schijf; daarna overleven alle afnames
    # (uitnodigingen + ingevulde vragenlijsten) elke herstart en deploy.
    startCommand: node dist/index.cjs

    # Persistente schijf: data.db overleeft nu herstarts en deploys.
    disk:
      name: tapas-data
      mountPath: /data
      sizeGB: 1

    # LEES DIT EERST, het heeft al een halve ochtend gekost.
    #
    # Dit bestand wordt door Render NIET gelezen voor de bestaande dienst
    # tapas-demo. Die dienst is met de hand in het dashboard aangemaakt, en
    # Render beschouwt zo'n dienst als volledig door het dashboard beheerd. Alles
    # wat hieronder staat, is ooit met de hand overgenomen.
    #
    # Gevolg: een variabele hier bijzetten verandert niets aan de draaiende site.
    # Wie een variabele toevoegt, moet die ook zelf in het Render-dashboard
    # zetten, bij de dienst onder Environment. Doe dat altijd in dezelfde beurt,
    # anders staat er hier iets wat nergens geldt.
    #
    # Dit bestand blijft wel de plek waar staat wat de dienst nodig heeft, en
    # het geldt onverkort wanneer de dienst ooit opnieuw vanaf dit bestand wordt
    # opgezet.
    envVars:
      - key: NODE_ENV
        value: production
      # SESSION_SECRET is VERPLICHT in productie (server/index.ts fail-fast, A3).
      # Render genereert eenmalig een veilige willekeurige waarde en bewaart die.
      - key: SESSION_SECRET
        generateValue: true
      # Persistentie: dwingt SQLite naar de gemounte schijf (server/storage.ts
      # regel 75 — TAPAS_DB_PATH-override wint altijd).
      - key: TAPAS_DB_PATH
        value: /data/data.db
      # Nodig voor de Vlaamse Sulafat-stem via Gemini TTS (server/tts.py, pad 1).
      # Zonder deze sleutel valt tts.py terug op de interne pplx-SDK, en die
      # bestaat enkel in de sandbox: op Render geeft dat een 500 en zwijgt de stem.
      # sync: false betekent dat Render de waarde niet uit dit bestand haalt maar
      # er expliciet om vraagt in het dashboard. De sleutel is een geheim en hoort
      # dus nooit in git; de sleutel kan zo ook niet stil ontbreken.
      - key: GEMINI_API_KEY
        sync: false
      # Vult de Regiekamer met een herkenbaar voorbeelddossier ("DEMO - Overname
      # Asterra Machines"), zodat bij een demonstratie te zien is wat het scherm
      # kan. Dit is bewust NIET dezelfde schakelaar als TAPAS_DEMO: die slaat de
      # wachtwoordcontrole over en blijft in productie onmogelijk. Deze maakt
      # enkel gegevens aan en raakt de aanmelding niet.
      # Zet de waarde op 0 of verwijder de regel om het dossier weg te laten;
      # wat al in de databank staat, blijft dan gewoon staan.
      - key: TAPAS_VOORBEELDDOSSIER
        value: "1"
      # VITE_DEMO_MODE is ingebakken via .env.production tijdens de build (DEMO_MODE=true)
      # PORT wordt automatisch door Render geïnjecteerd op 10000 — niet overschrijven
